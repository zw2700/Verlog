# Zero-shot inference only. Select through the canonical Slurm entrypoint with
# VERLOG_JOB_MODE=zero_shot; no PPO, critic, dataset, or W&B login is required.
defaults:
  - env@envs: auton_admissions
  - _self_
  - override hydra/job_logging: stdout  # No untracked log before the clean-source check.

backend: vllm  # fake is a CPU integration check, never experimental evidence.
conditions: [baseline, deliberation, deliberation_no_communication]
num_episodes: 20  # Per condition; override to 100 for the paired pilot.
batch_size: 16
seed_base: 0
inference_seed: 2026
tag: deliberation-zero-shot
dry_run: false
require_clean_git: true
output_dir: ${oc.env:PROJECT_DIR,.}/logs/${tag}_${oc.env:SLURM_JOB_ID,local}

envs:
  env_config:
    reward_mode: individual
    reward_optimum_atol: 1.0e-9
    format_penalty: 0.1
    invalid_action_penalty: 0.1

deliberation:
  max_rounds: 10
  readiness_quorum: null

model:
  path: ${oc.env:MODEL_PATH,Qwen/Qwen3-4B}
  # Exact public Qwen3-4B revision already cached on Rhea. Override revision too
  # when selecting another model/checkpoint.
  revision: 1cfa9a7208912126459214e8b04321603b3df60c
  tensor_parallel_size: ${oc.decode:${oc.env:NUM_GPUS_PER_NODE,1}}
  dtype: bfloat16
  gpu_memory_utilization: 0.8
  max_model_len: 8192
  enforce_eager: false
  enable_prefix_caching: true

sampling:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 512
  prompt_length: 4096
  enable_native_thinking: false  # Keep the environment's explicit private THINK blocks.

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
